<script>
/* ===== Google Drive sync (replaces claude.use('db')) ===== */
const DRV={cid:localStorage.getItem('skmCid')||'',on:localStorage.getItem('skmDrv')=='1',tok:null,exp:0,fid:localStorage.getItem('skmFid')||'',need:false,msg:''};
try{const t=JSON.parse(localStorage.getItem('skmTok')||'null');if(t&&t.exp>Date.now()+60000){DRV.tok=t.t;DRV.exp=t.exp}}catch(e){}
const DFN='SKM_Catering_Data.json',DAPI='https://www.googleapis.com/drive/v3/files',DUP='https://www.googleapis.com/upload/drive/v3/files';
const SH={sto:{c:{},cfg:{}},subs:[],pend:[],seq:0,mod:'',loaded:false,busy:false,again:false,poll:null};
try{SH.pend=JSON.parse(localStorage.getItem('skmPend')||'[]');SH.seq=SH.pend.reduce((a,o)=>Math.max(a,o.q||0),0)}catch(e){}
const pPersist=()=>{try{localStorage.setItem('skmPend',JSON.stringify(SH.pend))}catch(e){}};
function dStat(m,col){DRV.msg=m;const f=document.getElementById('drvfab');if(f){f.style.background=col||'#777';f.title=m}try{if(typeof ST!='undefined'&&typeof head=='function'&&m){ST=m;head()}}catch(e){}}
function gisReady(){return new Promise(r=>{let n=0;const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);r(true)}else if(++n>40){clearInterval(t);r(false)}},250)})}
async function getTokUI(){
 if(DRV.tok&&Date.now()<DRV.exp-60000)return DRV.tok;
 if(!DRV.cid||!await gisReady())return null;
 return new Promise(res=>{
  let done=false;const fin=v=>{if(!done){done=true;res(v)}};
  try{const c=google.accounts.oauth2.initTokenClient({client_id:DRV.cid,scope:'https://www.googleapis.com/auth/drive.file',
   callback:r=>{if(r&&r.access_token){DRV.tok=r.access_token;DRV.exp=Date.now()+(r.expires_in||3600)*1000;try{localStorage.setItem('skmTok',JSON.stringify({t:DRV.tok,exp:DRV.exp}))}catch(e){}DRV.need=false;fin(DRV.tok)}else fin(null)},
   error_callback:()=>fin(null)});
   c.requestAccessToken({prompt:''})}catch(e){fin(null)}
  setTimeout(()=>fin(null),90000)})}
function tokQuiet(){if(DRV.tok&&Date.now()<DRV.exp-60000)return DRV.tok;DRV.need=true;return null}
async function dv(url,opt){opt=opt||{};const t=tokQuiet();if(!t)throw new Error('auth');
 const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
 if(r.status==401){DRV.tok=null;DRV.need=true;throw new Error('auth')}
 if(!r.ok){const e=new Error('http'+r.status);e.status=r.status;throw e}return r}
async function ensureFile(){
 if(DRV.fid)return DRV.fid;
 const q=encodeURIComponent("name='"+DFN+"' and trashed=false");
 const j=await(await dv(DAPI+'?q='+q+'&fields=files(id,modifiedTime)&orderBy=modifiedTime desc')).json();
 if(j.files&&j.files.length)DRV.fid=j.files[0].id;
 else{const b='skm'+Date.now(),body='--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name:DFN,mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({c:{},cfg:{}})+'\r\n--'+b+'--';
  const r=await(await dv(DUP+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();DRV.fid=r.id}
 try{localStorage.setItem('skmFid',DRV.fid)}catch(e){}return DRV.fid}
const norm=o=>({c:(o&&o.c)||{},cfg:(o&&o.cfg)||{}});
function applyOps(st,ops){ops.forEach(o=>{if(o.k=='c'){const c=st.c[o.c]=st.c[o.c]||{};if(o.v===null)delete c[o.id];else c[o.id]=o.v}else st.cfg[o.n]=o.v})}
function eff(){const e={c:{},cfg:{...SH.sto.cfg}};for(const k in SH.sto.c)e.c[k]={...SH.sto.c[k]};applyOps(e,SH.pend);return e}
const cl=v=>v==null?v:JSON.parse(JSON.stringify(v));
function fire(){const e=eff();SH.subs.forEach(s=>{try{if(s.t=='c')s.cb({docs:Object.entries(e.c[s.n]||{}).map(([id,v])=>({id,data:()=>cl(v)}))});else{const v=e.cfg[s.n];s.cb({exists:v!=null,data:()=>cl(v)})}}catch(x){}})}
function qop(o){const i=SH.pend.findIndex(p=>p.k==o.k&&p.c==o.c&&p.id==o.id&&p.n==o.n);o.q=++SH.seq;if(i>=0)SH.pend[i]=o;else SH.pend.push(o);pPersist();clearTimeout(SH.dt);SH.dt=setTimeout(dCycle,1200)}
async function dCycle(){
 if(SH.busy){SH.again=true;return}SH.busy=true;
 try{
  const fid=await ensureFile();
  let meta=await(await dv(DAPI+'/'+fid+'?fields=modifiedTime')).json(),changed=!SH.loaded;
  if(SH.pend.length||meta.modifiedTime!==SH.mod){
   let remote=norm(await(await dv(DAPI+'/'+fid+'?alt=media')).json());
   if(SH.pend.length){
    const sent=new Set(SH.pend.map(o=>o.q));applyOps(remote,SH.pend);
    meta=await(await dv(DUP+'/'+fid+'?uploadType=media&fields=modifiedTime',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(remote)})).json();
    SH.pend=SH.pend.filter(o=>!sent.has(o.q));pPersist()}
   if(JSON.stringify(SH.sto)!==JSON.stringify(remote)){SH.sto=remote;changed=true}
   SH.mod=meta.modifiedTime}
  SH.loaded=true;if(changed)fire();
  dStat('Drive ✓','#1f7a3d')
 }catch(e){
  if(e&&e.status==404){DRV.fid='';try{localStorage.removeItem('skmFid')}catch(x){}}
  if(DRV.need)dStat('Drive: reconnect (kahin tap karein)','#d68a00');else dStat('Drive offline','#c0392b');
  if(!SH.loaded)throw e
 }finally{SH.busy=false;if(SH.again){SH.again=false;setTimeout(dCycle,400)}}}
const SHIM={
 collection:c=>({doc:id=>({set:async v=>{qop({k:'c',c,id:String(id),v:cl(v)})},delete:async()=>{qop({k:'c',c,id:String(id),v:null})}}),
  onSnapshot:(cb,er)=>{SH.subs.push({t:'c',n:c,cb});if(SH.loaded)setTimeout(()=>fire(),0)}}),
 doc:p=>{const n=p.split('/')[1];return{set:async v=>{qop({k:'cfg',n,v:cl(v)})},onSnapshot:(cb,er)=>{SH.subs.push({t:'cfg',n,cb});if(SH.loaded)setTimeout(()=>fire(),0)}}}};
async function getDb(){
 if(!DRV.on||!DRV.cid)return null;
 if(!tokQuiet()){dStat('Drive: reconnect (kahin tap karein)','#d68a00');return null}
 try{await dCycle()}catch(e){return null}
 if(!SH.poll){SH.poll=setInterval(()=>{if(!document.hidden)dCycle()},25000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dCycle()})}
 return SHIM}
/* first tap after token expiry = user gesture, so Google can refresh silently */
document.addEventListener('click',async()=>{if(!(DRV.on&&DRV.need)||DRV.busyTap)return;DRV.busyTap=true;const t=await getTokUI();DRV.busyTap=false;if(t){try{if(typeof db!='undefined'&&db)dCycle();else location.reload()}catch(e){location.reload()}}},true);
/* ---- cloud button + panel ---- */
function drvPanel(){let o=document.getElementById('drvp');if(o){o.remove();return}
 o=document.createElement('div');o.id='drvp';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:flex-end;justify-content:center';
 o.innerHTML='<div style="background:var(--card,#fff);color:var(--tx,#000);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px;max-height:90vh;overflow:auto"><b>Google Drive sync</b><p class="mu" id="drvs" style="margin:4px 0 8px"></p><label>Google OAuth Client ID</label><input id="gcid" placeholder="xxxx.apps.googleusercontent.com" value="'+DRV.cid.replace(/"/g,'')+'"><button style="width:100%;margin-top:8px" onclick="drvConnect()">Drive se connect karein</button><button class="g" style="width:100%;margin-top:6px" onclick="drvNow()">Abhi sync karein</button><button class="g" style="width:100%;margin-top:6px" onclick="drvOff()">Drive band karein</button><button class="g" style="width:100%;margin-top:6px" onclick="document.getElementById(\'drvp\').remove()">Close</button><p class="mu" style="margin-top:8px">Data Drive me <b>'+DFN+'</b> file me save hota hai. Sab devices par same Google account se connect karein.</p></div>';
 o.addEventListener('click',e=>{if(e.target==o)o.remove()});document.body.appendChild(o);drvSt()}
function drvSt(){const s=document.getElementById('drvs');if(s)s.textContent=DRV.on?(DRV.msg||'Connected'):'Abhi band hai (data sirf is phone me hai)'}
async function drvConnect(){const v=document.getElementById('gcid').value.trim();if(!v)return alert('Client ID dalein');
 DRV.cid=v;try{localStorage.setItem('skmCid',v)}catch(e){}DRV.tok=null;DRV.exp=0;
 const s=document.getElementById('drvs');s.textContent='Google login khul raha hai…';
 const t=await getTokUI();if(!t){s.textContent='Connect nahi hua. Client ID aur "Authorized JavaScript origin" check karein, phir dubara try karein.';return}
 DRV.on=true;try{localStorage.setItem('skmDrv','1')}catch(e){}s.textContent='Connected, app reload ho raha hai…';setTimeout(()=>location.reload(),600)}
async function drvNow(){if(!DRV.on)return;const t=await getTokUI();if(!t)return drvSt();try{await dCycle()}catch(e){}drvSt()}
function drvOff(){if(!confirm('Drive sync band karein? Data is phone me rahega.'))return;DRV.on=false;['skmDrv','skmTok','skmPend'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}
window.addEventListener('DOMContentLoaded',()=>{const f=document.createElement('button');f.id='drvfab';f.textContent='☁';f.style.cssText='position:fixed;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.3);background:'+(DRV.on?'#d68a00':'#777');f.onclick=drvPanel;document.body.appendChild(f)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

const words=n=>n>0?'Rupees '+w(Math.round(n))+' Only':'',pad=n=>String(n).padStart(3,'0'),nx=k=>D.n[k]=(D.n[k]||0)+1,cl=o=>JSON.parse(JSON.stringify(o));
function calc(b){const pl=b.days.reduce((a,d)=>a+(+d.plates||+d.pax||0),0),sub=pl*(+b.rate||0),base=sub+(+b.extra||0)-(+b.disc||0),g=base*(+b.gst||0)/100,total=Math.round(base+g),paid=b.pay.reduce((a,p)=>a+(+p.amt||0),0);return{pl,sub,g,total,paid,bal:total-paid}}
const qc=q=>{const sub=q.items.reduce((a,i)=>a+(+i.pax||0)*(+i.rate||0),0),base=sub+(+q.extra||0),g=base*(+q.gst||0)/100;return{sub,g,total:Math.round(base+g)}};

const ed=b=>b.days.map(d=>d.date).filter(Boolean).sort();



function list(){const up=D.b.filter(b=>ed(b)[0]&&dl(ed(b)[0])>=0&&dl(ed(b)[0])<=7).sort((a,b)=>ed(a)[0]>ed(b)[0]?1:-1);
let h=up.map(b=>`<div class="al">⏰ [${BN[bz(b)].p}] <b>${esc(b.party)}</b> – ${dl(ed(b)[0])==0?'aaj':dl(ed(b)[0])+' din baad'} (${fd(ed(b)[0])}), ${esc(b.venue)}</div>`).join('');
return h+`<div class="r"><input placeholder="Search party / venue" value="${esc(Q)}" oninput="Q=this.value;$('#l').innerHTML=rows()"><button style="flex:0 0 auto" onclick="go('form')">+ New</button></div><button class="g s" style="margin-top:8px" onclick="xb()">All bills → Excel</button><div id="l" style="margin-top:10px">${rows()}</div>`}
function rows(){const q=Q.toLowerCase(),L=D.b.filter(cb).filter(b=>(b.party+b.venue).toLowerCase().includes(q)).sort((a,b)=>(ed(b)[0]||'')>(ed(a)[0]||'')?1:-1);
return L.length?L.map(b=>{const c=calc(b);return`<div class="card" onclick="go('det',${b.id})"><div class="tot"><b>${esc(b.party)||'(no name)'}</b><span>${inr(c.total)}</span></div><div class="mu">${ed(b).map(fd).join(', ')||'date nahi'} · ${esc(b.venue)} · ${c.pl} plates</div><div>Pending: <span class="${c.bal>0?'bad':'ok'}">${inr(c.bal)}</span></div></div>`}).join(''):'<p class="mu">Abhi koi booking nahi. “+ New” dabaye.</p>'}
const f=(l,k,t='text')=>`<label>${l}</label><input type="${t}" value="${esc(cur[k])}" oninput="cur['${k}']=this.value">`;
function form(){const b=cur;return`<div class="card"><b>${id?'Edit':'New'} booking · ${BN[bz(b)].f}</b>${f('Party / Client name','party')}<div class="r"><div>${f('Mobile','phone','tel')}</div><div>${f('Email','email','email')}</div></div>${f('Client address','addr')}<div class="r"><div>${f('Event type','type')}</div><div>${f('Venue','venue')}</div></div>${f('Booking date','bdate','date')}</div>
<div class="card"><b>Event days</b>${b.days.map((d,i)=>`<div style="border-top:1px solid var(--ln);margin-top:8px"><div class="r"><div><label>Date</label><input type="date" value="${d.date}" oninput="cur.days[${i}].date=this.value"></div><div><label>Meal / Function</label><input value="${esc(d.meal)}" oninput="cur.days[${i}].meal=this.value"></div></div><div class="r"><div><label>Pax</label><input type="number" value="${d.pax}" oninput="cur.days[${i}].pax=this.value"></div><div><label>Plates</label><input type="number" value="${d.plates}" oninput="cur.days[${i}].plates=this.value"></div></div><label>Menu link / reference</label><input value="${esc(d.menu)}" oninput="cur.days[${i}].menu=this.value">${b.days.length>1?`<button class="g s" style="margin-top:6px" onclick="cur.days.splice(${i},1);draw()">Remove day</button>`:''}</div>`).join('')}<button class="g s" style="margin-top:8px" onclick="cur.days.push({date:'',meal:'',pax:'',plates:'',menu:''});draw()">+ Add day</button></div>
<div class="card"><b>Rate</b><div class="r"><div>${f('Rate / plate ₹','rate','number')}</div><div>${f('GST %','gst','number')}</div></div><div class="r"><div>${f('Extra charges ₹','extra','number')}</div><div>${f('Discount ₹','disc','number')}</div></div>${f('Notes','note')}</div>
<div class="r"><button class="g" onclick="go('${id?'det':'list'}',${id||'null'})">Cancel</button><button onclick="sv()">Save</button></div>`}
function sv(){if(!cur.party.trim())return note('Party ka naam likhiye');if(id){D.b[D.b.findIndex(x=>x.id==id)]=cur}else{cur.id=Date.now();cur.no=nx(cur.biz);D.b.push(cur);id=cur.id}save();go('det',id)}

<div class="tot"><span>${c.pl} plates × ${inr(b.rate)}</span><span>${inr(c.sub)}</span></div><div class="tot"><span>Total (incl. GST)</span><b>${inr(c.total)}</b></div><div class="tot"><span>Received</span><span class="ok">${inr(c.paid)}</span></div><div class="tot"><span>Pending</span><span class="bad">${inr(c.bal)}</span></div></div>
<div class="card"><b>Payments</b>${b.pay.map((p,i)=>`<div class="tot" style="margin-top:6px"><span>${fd(p.date)} · ${p.mode} · ${p.for}</span><span>${inr(p.amt)} <button class="s" onclick="doc('rc',${i})">Receipt</button> <button class="g s" onclick="D.b.find(x=>x.id==${b.id}).pay.splice(${i},1);save();draw()">✕</button></span></div>`).join('')||'<p class="mu">Abhi koi payment nahi.</p>'}
<div class="r" style="margin-top:8px"><input id="pa" type="number" placeholder="Amount ₹"><select id="pm"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></div><div class="r" style="margin-top:6px"><select id="pf"><option>Advance</option><option>Instalment</option><option>Final Balance</option></select><input id="pd" type="date" value="${today()}"></div><button style="margin-top:8px;width:100%" onclick="addp()">+ Payment add karein</button></div>

rm=()=>D.sm.filter(m=>(!RF.iid||m.iid==RF.iid)&&(!RF.from||m.d>=RF.from)&&(!RF.to||m.d<=RF.to)&&(!RF.eid||m.eid==RF.eid)).sort((a,b)=>a.d>b.d?1:-1);
function rep(){const s=(l,k,o)=>`<div><label>${l}</label><select onchange="RF['${k}']=this.value;$('#rr').innerHTML=rres()"><option value="">Sab</option>${o.map(([v,t])=>`<option value="${esc(v)}" ${String(RF[k])==String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
return`<div class="card"><b>Filters</b><div class="r"><div><label>From</label><input type="date" value="${RF.from}" oninput="RF.from=this.value;$('#rr').innerHTML=rres()"></div><div><label>To</label><input type="date" value="${RF.to}" oninput="RF.to=this.value;$('#rr').innerHTML=rres()"></div></div><div class="r">${s('Event','eid',D.b.map(b=>[b.id,b.party]))}${s('User','uid',[['admin','Admin'],...D.u.map(u=>[u.id,u.name])])}</div><div class="r">${s('Category','c',CAT.map(c=>[c,c]))}${s('Location','loc',D.locs.map(c=>[c,c]))}</div><div class="r">${s('Type','kind',[['event','Party / Event'],['general','General']])}${s('Inventory item','iid',D.iv.map(i=>[i.id,i.name]))}</div><div class="r" style="margin-top:10px"><button onclick="xl()">Excel</button><button class="g" onclick="rpdf()">PDF</button></div></div><div id="rr">${rres()}</div>`}
function rres(){const X=rf(),A=ra(),M=rm();return`<div class="card"><div class="tot"><b>Kul kharcha (${X.length})</b><b class="bad">${inr(tt(X))}</b></div><div class="tot mu"><span>Party / Event</span><span>${inr(tt(X.filter(x=>x.kind=='event')))}</span></div><div class="tot mu"><span>General</span><span>${inr(tt(X.filter(x=>x.kind=='general')))}</span></div><div class="tot mu"><span>Advance diye</span><span>${inr(A.reduce((s,x)=>s+ +x.amt,0))}</span></div></div><div class="card"><b>Category-wise</b>${bars(sum(X,x=>x.c))}</div><div class="card"><b>User-wise</b>${bars(sum(X,x=>UN(x.uid)))}</div><div class="card"><b>Location-wise</b>${bars(sum(X,x=>x.loc||'-'))}</div><div class="card"><b>Stock</b>${D.iv.filter(i=>!RF.iid||i.id==RF.iid).map(i=>{const k=sk(i);return`<div class="tot mu" style="margin-top:6px"><span>${esc(i.name)}<br>Total ${k.tot} · Toota ${k.b} · Kho gaya ${k.l}</span><b>${k.av}</b></div>`}).join('')||'<p class="mu">Koi item nahi.</p>'}<p class="mu">Stock movements (filtered): ${M.length}</p></div>`}
async function xl(){if(!window.XLSX)return note('Excel library load nahi hui – internet check karein');const X=rf(),A=ra(),M=rm(),sg=(L,k)=>Object.entries(sum(L,k));
const sh=[['Expenses',[['Date','Business','Type','Event / Party','Category','Location','Spent by','Amount (₹)','Status','Description'],...X.map(x=>[fd(x.d),BN[bz(x)].f,x.kind=='event'?'Event':'General',x.kind=='event'?EV(x.eid):'',x.c,x.loc,UN(x.uid),+x.a,x.st,x.n||'']),['','','','','','','Total',tt(X),'','']]],
['Advances',[['Date','User','Event','Amount (₹)','Purpose'],...A.map(x=>[fd(x.d),UN(x.uid),x.eid?EV(x.eid):'General',+x.amt,x.purpose||''])]],
['Summary',[['By Category',''],...sg(X,x=>x.c),[],['By User',''],...sg(X,x=>UN(x.uid)),[],['By Event',''],...sg(X.filter(x=>x.kind=='event'),x=>EV(x.eid)),[],['By Location',''],...sg(X,x=>x.loc||'-')]],
['Stock',[['Item','Category','Unit','Total','Available','Out at events','Broken','Lost','Min level'],...D.iv.map(i=>{const k=sk(i);return[i.name,i.cat,i.unit,k.tot,k.av,k.out,k.b,k.l,i.min]})]],
['Stock History',[['Date','Item','Type','Qty','Event','By','Note'],...M.map(m=>[fd(m.d),IN(m.iid),m.t,+m.q,m.eid?EV(m.eid):'',UN(m.uid),m.n||''])]]],wb=XLSX.utils.book_new();
sh.forEach(([n,d])=>{const ws=XLSX.utils.aoa_to_sheet(d);ws['!cols']=(d[0]||['']).map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,n)});dlf('Report_'+today()+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]))}
function rpdf(){const X=rf(),A=ra(),th=a=>'<tr>'+a.map(c=>`<th>${c}</th>`).join('')+'</tr>',td=a=>'<tr>'+a.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>';
DN='Report-'+today();show(hdr(D.biz)+`<h2>REPORT</h2><p>${RF.from?fd(RF.from):'Start'} – ${RF.to?fd(RF.to):'Today'}</p><table>${th(['Date','Type','Event','Category','Location','By','Amount'])}${X.map(x=>td([fd(x.d),x.kind=='event'?'Event':'General',x.kind=='event'?EV(x.eid):'',x.c,x.loc,UN(x.uid),inr(x.a)])).join('')}${td(['','','','','','Total',inr(tt(X))])}</table><h3>Advances</h3><table>${th(['Date','User','Event','Amount'])}${A.map(x=>td([fd(x.d),UN(x.uid),x.eid?EV(x.eid):'General',inr(x.amt)])).join('')}</table><h3>Stock</h3><table>${th(['Item','Total','Available','Broken','Lost'])}${D.iv.map(i=>{const k=sk(i);return td([i.name,k.tot,k.av,k.b,k.l])}).join('')}</table>`)}
/* PDF */
async function mkpdf(){const el=$('#dc .doc'),cv=await html2canvas(el,{scale:2,backgroundColor:'#fff'}),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),m=8,iw=210-2*m,ppx=cv.width/iw,ph=Math.floor((297-2*m)*ppx);for(let y=0,i=0;y<cv.height;y+=ph,i++){const c=document.createElement('canvas');c.width=cv.width;c.height=Math.min(ph,cv.height-y);c.getContext('2d').drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,c.height/ppx)}return pdf.output('blob')}
const pn=()=>DNS.replace(/[^\w]+/g,'-')+'.pdf';
async function pdfSave(){if(!window.html2canvas||!window.jspdf)return note('PDF library load nahi hui – internet check karein');note('PDF ban rahi hai…');try{const b=await mkpdf();mc();await dlf(pn(),b)}catch(e){note('PDF nahi ban payi')}}
async function pdfShare(){if(!window.html2canvas||!window.jspdf)return note('PDF library load nahi hui');note('PDF ban rahi hai…');try{const b=await mkpdf(),f=new File([b],pn(),{type:'application/pdf'});mc();if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}await dlf(pn(),b)}catch(e){if(!e||e.name!='AbortError')note('Share nahi ho payi – "Save PDF" use karein')}}
function pr(){try{print()}catch(e){note('Print yaha block hai – "Save PDF" use karein')}}
boot();
