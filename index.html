<script>
(function(){
/* ===== Supabase sync (replaces claude.use('db')) ===== */
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},st_=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const SB={url:g('skmSbU')||'',key:g('skmSbK')||'',cli:null,loaded:false,subs:[],c:{},cfg:{},pend:[],busy:false,msg:'',ch:null,seq:0,started:false,email:''};
try{SB.pend=JSON.parse(g('skmPendSb')||'[]');SB.seq=SB.pend.reduce((a,o)=>Math.max(a,o.q||0),0)}catch(e){}
const pp=()=>st_('skmPendSb',JSON.stringify(SB.pend));
const cl=v=>v==null?v:JSON.parse(JSON.stringify(v));
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x=='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,b)=>(a[b]=x[b],a),{}):x);
function stat(m,col){SB.msg=m;const f=document.getElementById('sbfab');if(f){f.style.background=col||'#777';f.title=m}try{if(typeof ST!='undefined'&&typeof head=='function'){ST=m;head()}}catch(e){}const s=document.getElementById('sbs');if(s)s.textContent=m}
function fire(){SB.subs.forEach(x=>{try{if(x.t=='c')x.cb({docs:Object.entries(SB.c[x.n]||{}).map(([id,v])=>({id,data:()=>cl(v)}))});else{const v=SB.cfg[x.n];x.cb({exists:v!=null,data:()=>cl(v)})}}catch(e){}})}
function put(col,id,v){const m=SB.c[col]=SB.c[col]||{};if(v===null)delete m[id];else m[id]=v}
function enq(o){const i=SB.pend.findIndex(p=>p.k==o.k&&p.c==o.c&&p.id==o.id&&p.n==o.n);o.q=++SB.seq;if(i>=0)SB.pend[i]=o;else SB.pend.push(o);pp();clearTimeout(SB.ft);SB.ft=setTimeout(flush,500)}
async function flush(){
 if(SB.busy||!SB.cli||!SB.started)return;SB.busy=true;
 try{while(SB.pend.length){const o=SB.pend[0],q=o.q;let r;
  if(o.k=='c')r=o.v===null?await SB.cli.from('docs').delete().eq('col',o.c).eq('id',o.id):await SB.cli.from('docs').upsert({col:o.c,id:o.id,data:o.v},{onConflict:'col,id'});
  else r=await SB.cli.from('cfg').upsert({name:o.n,data:o.v},{onConflict:'name'});
  if(r.error)throw r.error;SB.pend=SB.pend.filter(p=>p.q!=q);pp()}
  stat('Online ✓','#1f7a3d')}
 catch(e){stat('Offline – sync ruka ('+((e&&e.message)||'error').slice(0,40)+')','#c0392b');clearTimeout(SB.rt);SB.rt=setTimeout(flush,15000)}
 finally{SB.busy=false}}
async function pull(){
 const c={},cf={};let from=0;
 for(;;){const r=await SB.cli.from('docs').select('col,id,data').order('col').order('id').range(from,from+999);if(r.error)throw r.error;r.data.forEach(x=>{(c[x.col]=c[x.col]||{})[x.id]=x.data});if(r.data.length<1000)break;from+=1000}
 const r2=await SB.cli.from('cfg').select('name,data');if(r2.error)throw r2.error;r2.data.forEach(x=>cf[x.name]=x.data);
 const before=canon([SB.c,SB.cfg]);SB.c=c;SB.cfg=cf;
 SB.pend.forEach(o=>{if(o.k=='c')put(o.c,o.id,o.v);else SB.cfg[o.n]=o.v});
 const ch=!SB.loaded||before!==canon([SB.c,SB.cfg]);SB.loaded=true;if(ch)fire()}
function live(){
 if(SB.ch)return;
 SB.ch=SB.cli.channel('skm-live')
 .on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const r=p.eventType=='DELETE'?p.old:p.new;if(!r||r.col==null)return;const cur=(SB.c[r.col]||{})[r.id];
   if(p.eventType=='DELETE'){if(cur!==undefined){put(r.col,r.id,null);fire()}}else if(canon(cur)!==canon(r.data)){put(r.col,r.id,r.data);fire()}})
 .on('postgres_changes',{event:'*',schema:'public',table:'cfg'},p=>{const r=p.eventType=='DELETE'?p.old:p.new;if(!r||!r.name)return;if(p.eventType=='DELETE')delete SB.cfg[r.name];else if(canon(SB.cfg[r.name])!==canon(r.data))SB.cfg[r.name]=r.data;else return;fire()})
 .subscribe(s=>{if(s=='SUBSCRIBED')stat('Online ✓','#1f7a3d');else if(s=='CHANNEL_ERROR'||s=='TIMED_OUT')stat('Live sync ruka – refresh karein','#d68a00')})}
const SHIM={
 collection:c=>({doc:id=>({set:async v=>{put(c,String(id),cl(v));enq({k:'c',c,id:String(id),v:cl(v)})},delete:async()=>{put(c,String(id),null);enq({k:'c',c,id:String(id),v:null})}}),
  onSnapshot:(cb,er)=>{SB.subs.push({t:'c',n:c,cb});if(SB.loaded)setTimeout(()=>fire(),0)}}),
 doc:p=>{const n=p.split('/')[1];return{set:async v=>{SB.cfg[n]=cl(v);enq({k:'cfg',n,v:cl(v)})},onSnapshot:(cb,er)=>{SB.subs.push({t:'cfg',n,cb});if(SB.loaded)setTimeout(()=>fire(),0)}}}};
async function getDb(){
 if(!SB.url||!SB.key)return null;
 if(!window.supabase){stat('Supabase library load nahi hui (internet check karein)','#c0392b');return null}
 try{
  SB.cli=SB.cli||window.supabase.createClient(SB.url,SB.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const s=(await SB.cli.auth.getSession()).data.session;
  if(!s){stat('Partner login karein (☁ dabayein)','#d68a00');return null}
  SB.email=s.user.email||'';
  await pull();SB.started=true;live();flush();
  setInterval(()=>{if(!document.hidden)flush()},20000);
  window.addEventListener('online',()=>{flush();pull().catch(()=>{})});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull().catch(()=>{});flush()}});
  stat('Online ✓','#1f7a3d');return SHIM
 }catch(e){stat('Server se connect nahi hua ('+((e&&e.message)||'').slice(0,40)+')','#c0392b');return null}}
/* ---- cloud button + panel ---- */
const E=s=>String(s).replace(/"/g,'&quot;');
function sbPanel(){let o=document.getElementById('sbp');if(o){o.remove();return}
 o=document.createElement('div');o.id='sbp';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:flex-end;justify-content:center';
 o.innerHTML='<div style="background:var(--card,#fff);color:var(--tx,#000);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px;max-height:90vh;overflow:auto"><b>Cloud sync (Supabase)</b><p class="mu" id="sbs" style="margin:4px 0 8px">'+(SB.msg||'Abhi band hai (data sirf is phone me hai)')+'</p>'
 +'<label>Project URL</label><input id="sbu" placeholder="https://xxxx.supabase.co" value="'+E(SB.url)+'">'
 +'<label>Anon / Publishable key (service_role kabhi nahi)</label><input id="sbk" value="'+E(SB.key)+'">'
 +'<label>Partner email</label><input id="sbe" type="email" value="'+E(SB.email)+'">'
 +'<label>Partner PIN (6 ank)</label><input id="sbp2" type="password" inputmode="numeric">'
 +'<button style="width:100%;margin-top:8px" onclick="sbLogin()">Login / Connect</button>'
 +'<button class="g" style="width:100%;margin-top:6px" onclick="sbNow()">Abhi sync karein</button>'
 +'<button class="g" style="width:100%;margin-top:6px" onclick="sbOut()">Logout</button>'
 +'<button class="g" style="width:100%;margin-top:6px" onclick="document.getElementById(\'sbp\').remove()">Close</button></div>';
 o.addEventListener('click',e=>{if(e.target==o)o.remove()});document.body.appendChild(o)}
const say=m=>{const s=document.getElementById('sbs');if(s)s.textContent=m};
async function sbLogin(){
 const v=i=>document.getElementById(i).value.trim(),u=v('sbu').replace(/\/+$/,''),k=v('sbk'),e=v('sbe'),p=document.getElementById('sbp2').value;
 if(!u||!k||!e||!p)return say('Sab fields bharein');
 if(!window.supabase)return say('Supabase library load nahi hui. Internet check karein.');
 SB.cli=null;say('Connection check ho raha hai…');
 try{SB.cli=window.supabase.createClient(u,k,{auth:{persistSession:true,autoRefreshToken:true}});const r=await SB.cli.auth.signInWithPassword({email:e,password:p});
  if(r.error)return say('Login nahi hua: '+r.error.message+' (dobara try karein)');
  const pr=await SB.cli.from('partners').select('name,active').eq('id',r.data.user.id).maybeSingle();
  if(!pr.data||!pr.data.active)return say('Ye account partner list me active nahi hai.');
  st_('skmSbU',u);st_('skmSbK',k);SB.url=u;SB.key=k;say('Connection theek hai. Config is device par save ho gaya. Reload…');setTimeout(()=>location.reload(),600)
 }catch(x){say('Connect nahi hua. URL aur key check karein.')}}
async function sbNow(){if(!SB.cli||!SB.started)return say('Pehle login karein');try{await pull();await flush()}catch(e){say('Sync nahi hua: '+((e&&e.message)||''))}}
async function sbOut(){if(!confirm('Logout karein? Data cloud me safe rahega.'))return;try{if(SB.cli)await SB.cli.auth.signOut()}catch(e){}location.reload()}
window.addEventListener('DOMContentLoaded',()=>{const f=document.createElement('button');f.id='sbfab';f.textContent='☁';f.style.cssText='position:fixed;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.3);background:'+(SB.url?'#d68a00':'#777');f.onclick=sbPanel;document.body.appendChild(f)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.getDb=getDb;window.sbPanel=sbPanel;window.sbLogin=sbLogin;window.sbNow=sbNow;window.sbOut=sbOut;
window.__SB=SB;
})();
</script>

function calc(b){const pl=b.days.reduce((a,d)=>a+(+d.plates||+d.pax||0),0),sub=pl*(+b.rate||0),base=sub+(+b.extra||0)-(+b.disc||0),g=base*(+b.gst||0)/100,total=Math.round(base+g),paid=b.pay.reduce((a,p)=>a+(+p.amt||0),0);return{pl,sub,g,total,paid,bal:total-paid}}
const qc=q=>{const sub=q.items.reduce((a,i)=>a+(+i.pax||0)*(+i.rate||0),0),base=sub+(+q.extra||0),g=base*(+q.gst||0)/100;return{sub,g,total:Math.round(base+g)}};

function list(){const up=D.b.filter(b=>ed(b)[0]&&dl(ed(b)[0])>=0&&dl(ed(b)[0])<=7).sort((a,b)=>ed(a)[0]>ed(b)[0]?1:-1);

<div class="card"><b>Event days</b>${b.days.map((d,i)=>`<div style="border-top:1px solid var(--ln);margin-top:8px"><div class="r"><div><label>Date</label><input type="date" value="${d.date}" oninput="cur.days[${i}].date=this.value"></div><div><label>Meal / Function</label><input value="${esc(d.meal)}" oninput="cur.days[${i}].meal=this.value"></div></div><div class="r"><div><label>Pax</label><input type="number" value="${d.pax}" oninput="cur.days[${i}].pax=this.value"></div><div><label>Plates</label><input type="number" value="${d.plates}" oninput="cur.days[${i}].plates=this.value"></div></div><label>Menu link / reference</label><input value="${esc(d.menu)}" oninput="cur.days[${i}].menu=this.value">${b.days.length>1?`<button class="g s" style="margin-top:6px" onclick="cur.days.splice(${i},1);draw()">Remove day</button>`:''}</div>`).join('')}<button class="g s" style="margin-top:8px" onclick="cur.days.push({date:'',meal:'',pax:'',plates:'',menu:''});draw()">+ Add day</button></div>

/* PDF */
async function mkpdf(){const el=$('#dc .doc'),cv=await html2canvas(el,{scale:2,backgroundColor:'#fff'}),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),m=8,iw=210-2*m,ppx=cv.width/iw,ph=Math.floor((297-2*m)*ppx);for(let y=0,i=0;y<cv.height;y+=ph,i++){const c=document.createElement('canvas');c.width=cv.width;c.height=Math.min(ph,cv.height-y);c.getContext('2d').drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,c.height/ppx)}return pdf.output('blob')}
const pn=()=>DNS.replace(/[^\w]+/g,'-')+'.pdf';
async function pdfSave(){if(!window.html2canvas||!window.jspdf)return note('PDF library load nahi hui – internet check karein');note('PDF ban rahi hai…');try{const b=await mkpdf();mc();await dlf(pn(),b);dlog('PDF download','PDF device par save hui')}catch(e){note('PDF nahi ban payi')}}
async function pdfShare(){if(!window.html2canvas||!window.jspdf)return note('PDF library load nahi hui');note('PDF ban rahi hai…');try{const b=await mkpdf(),f=new File([b],pn(),{type:'application/pdf'});mc();if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});dlog('Share sheet','Share sheet khula (delivery confirm nahi)');return}await dlf(pn(),b);dlog('PDF download','Share support nahi – PDF save hui')}catch(e){if(!e||e.name!='AbortError')note('Share nahi ho payi – "Save PDF" use karein')}}

function cbc(){const cb=D.cb||{oc:0,ob:0},W=D.w||[];let cr=0,br=0,ur=0,ce=0,be=0,ue=0;
 D.b.forEach(b=>b.pay.forEach(p=>{const a=+p.amt||0,m=String(p.mode||'');if(/cash/i.test(m))cr+=a;else if(m)br+=a;else ur+=a}));
 D.x.forEach(x=>{if(x.st=='rejected')return;const a=+x.a||0;if(x.src=='cash')ce+=a;else if(x.src=='bank')be+=a;else{ue+=a}});
 const cw=W.filter(w=>w.src=='cash').reduce((a,w)=>a+ +w.a,0),bw=W.filter(w=>w.src=='bank').reduce((a,w)=>a+ +w.a,0),cash=(+cb.oc||0)+cr-ce-cw,bank=(+cb.ob||0)+br-be-bw;
 return{cr,br,ur,ce,be,ue,cw,bw,cash,bank,tot:cash+bank,cb}}

${(c.ur||c.ue)?`<div class="al">Source set nahi: Received ${inr(c.ur)}, Kharcha ${inr(c.ue)}. Ye balance me nahi ginte. Kharcha edit karke Payment source chunein.</div>`:''}
